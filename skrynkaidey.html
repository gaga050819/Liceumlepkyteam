<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">

<style>
:root {
    --bg-light: #f1e1cd;
    --text-light: #4b5982;
    --bg: #f1e1cd;
    --text: #4b5982;
    --card-bg: rgba(255,255,255,0.3);
    --card-border: rgba(255,255,255,0.5);
    --transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
    --tr: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
}
*,*::before,*::after { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-light), #e5d2b8, var(--bg-light));
    color: var(--text-light);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    transition: background 0.8s ease, color 0.5s ease;
    overflow-x: hidden;
}
body.dark {
    --bg-light: #4b5982;
    --text-light: #f1e1cd;
    --bg: #4b5982;
    --text: #f1e1cd;
    --card-bg: rgba(241,225,205,0.1);
    --card-border: rgba(241,225,205,0.2);
    background: linear-gradient(180deg,#4b5982,#353f5c,#4b5982) !important;
}
.controls {
    position: fixed; top: 20px; left: 20px;
    z-index: 1000; display: flex; flex-direction: column; gap: 15px;
}
#themeBtn, #menuBtn {
    padding: 12px; border-radius: 50px;
    border: 1px solid var(--card-border);
    background: var(--card-bg); backdrop-filter: blur(15px);
    color: inherit; cursor: pointer; font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    transition: var(--transition);
    display: flex; justify-content: center; align-items: center;
}
#menuBtn { width: 50px; height: 50px; font-size: 22px; }
@media (hover:hover) {
    #themeBtn:hover, #menuBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); }
}

/* iOS sidebar fix */
.sidebar {
    position: fixed; top: 0; left: -100%;
    width: 100%; max-width: 300px;
    height: 100vh; height: -webkit-fill-available;
    background: var(--card-bg); backdrop-filter: blur(40px);
    border-right: 1px solid var(--card-border);
    z-index: 1001; transition: var(--transition);
    display: flex; flex-direction: column;
    padding: 100px 30px 0;
    box-shadow: 15px 0 50px rgba(0,0,0,0.2);
    opacity: 0; visibility: hidden;
}
.sidebar.open { left: 0; opacity: 1; visibility: visible; }
.sidebar-links { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.sidebar a {
    text-decoration: none; padding: 18px 25px; margin-bottom: 20px;
    border-radius: 25px; background: rgba(255,255,255,0.1);
    border: 1px solid var(--card-border);
    color: inherit; font-weight: 700; font-size: 1.2rem; transition: var(--transition);
}
@media (hover:hover) {
    .sidebar a:hover { transform: translateX(10px); background: rgba(255,255,255,0.3); }
}
#closeBtn {
    position: absolute; top: 30px; right: 30px;
    background: none; border: none; font-size: 28px; color: inherit; cursor: pointer;
}
#versionBox {
    padding: 15px 20px calc(15px + env(safe-area-inset-bottom));
    font-size: 13px; opacity: 0.6; flex-shrink: 0; color: var(--text-light);
}

.container {
    width: 95%; max-width: 800px;
    margin-top: 100px; margin-bottom: 50px;
}
.card {
    width: 100%; padding: clamp(20px,5vw,40px);
    background: var(--card-bg); backdrop-filter: blur(25px);
    border: 1px solid var(--card-border);
    border-radius: 40px;
}
.card img {
    width: 100%; border-radius: 30px; margin-bottom: 25px;
}
.form-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
.form-input {
    width: 100%;
    padding: 15px; border-radius: 15px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.2);
    color: var(--text-light);
    font-size: 1rem; font-family: inherit;
}
textarea.form-input { resize: vertical; min-height: 150px; }
.form-input::placeholder { color: var(--text-light); opacity: 0.8; }
body.dark .form-input { background: rgba(0,0,0,0.2); border-color: rgba(241,225,205,0.2); }
.monobank-btn {
    display: block; text-align: center;
    background: var(--text-light); color: var(--bg-light) !important;
    padding: 18px; border-radius: 20px;
    text-decoration: none; font-weight: bold;
    margin-top: 15px; transition: var(--transition);
    border: none; cursor: pointer; font-size: 1rem; width: 100%;
}
.monobank-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
.monobank-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Bug report */
#bugTrigger {
    background: none; border: none; cursor: pointer;
    font-size: 0.8rem; font-weight: 600; opacity: 0.5;
    color: var(--text-light); display: block; margin: 10px auto 0;
}
#bugTrigger:hover { opacity: 1; }
#bugModal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 9500;
    align-items: flex-end; justify-content: center;
    backdrop-filter: blur(8px);
}
#bugModal.open { display: flex; }
.bug-box {
    width: 100%; max-width: 500px;
    background: var(--bg-light); border-radius: 30px 30px 0 0;
    padding: 30px 28px calc(35px + env(safe-area-inset-bottom));
    box-shadow: 0 -20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.bug-box h3 { margin: 0 0 8px; font-size: 1.4rem; font-weight: 800; }
.bug-box p { margin: 0 0 20px; font-size: 0.95rem; opacity: 0.7; }
.bug-box textarea {
    width: 100%; border-radius: 18px; border: 1.5px solid var(--card-border);
    background: var(--card-bg); color: var(--text-light);
    padding: 16px; font-size: 1rem; font-family: inherit;
    resize: none; outline: none; min-height: 120px;
}
.bug-box-btns { display: flex; gap: 12px; margin-top: 18px; }
.bug-send {
    flex: 2; padding: 16px; border-radius: 18px; border: none;
    background: var(--text-light); color: var(--bg-light);
    font-size: 1rem; font-weight: 700; cursor: pointer;
}
.bug-send:disabled { opacity: 0.5; }
.bug-cancel {
    flex: 1; padding: 16px; border-radius: 18px;
    border: 1.5px solid var(--card-border); background: none;
    color: var(--text-light); font-size: 1rem; cursor: pointer;
}

footer { width: 100%; padding: 40px 20px; text-align: center; margin-top: auto; }
.social-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 25px; margin-bottom: 35px; }
.social-links a { text-decoration: none; color: inherit; font-weight: 700; font-size: 1rem; letter-spacing: 1px; transition: var(--tr); }
.social-links a:hover { opacity: 0.7; }

@media (max-width: 768px) {
    .controls { flex-direction: row; width: calc(100% - 40px); justify-content: space-between; top: 15px; }
    #themeBtn, #menuBtn { padding: 10px 15px; height: 45px; font-size: 14px; }
    #menuBtn { width: 45px; padding: 0; position: fixed; right: 20px; left: auto; }
    .container { margin-top: 80px; }
}
</style>
</head>
<body>

<div id="bugModal" onclick="if(event.target===this)closeBug()">
    <div class="bug-box">
        <h3>🐞 Повідомити про баг 🐞</h3>
        <p>Опишіть проблему на сайті</p>
        <textarea id="bugText" placeholder="Наприклад: форма не відправляється..."></textarea>
        <div class="bug-box-btns">
            <button class="bug-cancel" onclick="closeBug()">Скасувати</button>
            <button class="bug-send" onclick="sendBug()">📨 Надіслати</button>
        </div>
    </div>
</div>

<div class="controls">
    <button id="themeBtn" onclick="toggleTheme()">🌓 Тема</button>
    <button id="menuBtn" onclick="toggleMenu()">🏠</button>
</div>

<div class="sidebar" id="sidebar">
    <button id="closeBtn" onclick="toggleMenu()">✖</button>
    <div class="sidebar-links">
        <a href="index.html">Головна</a>
        <a href="news.html">Новини</a>
        <a href="about.html">Про нас</a>
        <a href="past_events.html">Проєкти</a>
        <a href="skrynkaidey.html">Скринька ідей</a>
        <a href="Konkyrs.html">Реєстрація на конкурс</a>
    </div>
    <div id="versionBox">Версія: <span id="version"></span></div>
</div>

<div class="container">
    <div class="card">
        <img src="Forskrynkaidey.png" alt="Фото конкурсу" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'rgba(0,0,0,0.1)\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'20\' fill=\'gray\'>Фото конкурсу</text></svg>'">
        <h2>Скринька ідей</h2>
        <p>Заповніть дані, і після натискання кнопки ми отримаємо вашу ідею.</p>
        <form action="https://api.web3forms.com/submit" method="POST" class="form-group" id="contestForm">
            <input type="hidden" name="access_key" value="e8a2b6b2-a256-4cde-bd25-acf647d0d522">
            <input type="hidden" name="subject" value="Нова ідея — Скринька ідей">
            <input type="hidden" name="from_name" value="Скринька ідей">
            <input type="text" name="Name" class="form-input" placeholder="Ім'я (необов'язково)">
            <input type="text" name="Sername" class="form-input" placeholder="Прізвище (необов'язково)">
            <input type="text" name="Klass" class="form-input" placeholder="Клас (необов'язково)">
            <input type="email" name="Email" class="form-input" placeholder="Ваша електронна пошта (необов'язково)">
            <textarea name="message" class="form-input" placeholder="Напишіть сюди свою ідею..." required></textarea>
            <div class="h-captcha" data-captcha="true"></div>
            <button type="submit" id="submitBtn" class="monobank-btn">Відправити ідею</button>
        </form>
    </div>
</div>

<footer>
    <div class="social-links">
        <a href="https://www.instagram.com/uchnivskesamovriaduvannia" target="_blank">INSTAGRAM</a>
        <a href="https://www.facebook.com/share/1DtXY2x5Us/" target="_blank">FACEBOOK</a>
        <a href="https://t.me/DNLLepkyi" target="_blank">TELEGRAM</a>
        <a href="https://www.tiktok.com/@lyceumlepkogo" target="_blank">TIKTOK</a>
    </div>
    <p style="opacity:0.6;font-size:0.85rem;font-weight:600;">&copy; 2026 учнівське самоврядування</p>
    <button id="bugTrigger" onclick="openBug()">🐞 Повідомити про баг 🐞</button>
</footer>

<script>
function toggleTheme() {
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('theme-color-meta') && (document.getElementById('theme-color-meta').content = dark ? '#4b5982' : '#f1e1cd');
}
function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

const form = document.getElementById('contestForm');
const btn = document.getElementById('submitBtn');

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const hCaptcha = form.querySelector('textarea[name=h-captcha-response]')?.value;
    if (!hCaptcha) {
        Swal.fire({
            icon: 'warning', title: 'Ой!',
            text: 'Будь ласка, підтвердіть, що ви не робот (капча).',
            confirmButtonText: 'Зрозуміло', confirmButtonColor: '#4b5982',
        });
        return;
    }
    btn.disabled = true; btn.innerText = "Відправка...";
    const formData = new FormData(form);
    try {
        const response = await fetch("https://api.web3forms.com/submit", {
            method: 'POST', body: formData, headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        if (response.ok && data.success) {
            form.reset(); btn.disabled = false; btn.innerText = "Відправити ідею";
            Swal.fire({
                icon: 'success', title: '🎉 Ідею надіслано!',
                text: 'Дякуємо! Ми обов\'язково розглянемо вашу пропозицію.',
                confirmButtonText: 'Чудово!', confirmButtonColor: '#4b5982',
                timer: 4000, timerProgressBar: true,
            });
        } else {
            Swal.fire({ icon: 'error', title: 'Помилка', text: data.message || 'Щось пішло не так.', confirmButtonColor: '#4b5982' });
            btn.disabled = false; btn.innerText = "Відправити ідею";
        }
    } catch(e) {
        Swal.fire({ icon: 'error', title: 'Помилка мережі', text: 'Перевірте підключення.', confirmButtonColor: '#4b5982' });
        btn.disabled = false; btn.innerText = "Відправити ідею";
    }
});

const BUG_TELEGRAM_TOKEN = '8450851710:AAGsC5O72ab-C8ZWw2guCc7bGMX0rRbhhZI';
const BUG_CHAT_ID = '6190541661';
function openBug() { document.getElementById('bugModal').classList.add('open'); }
function closeBug() { document.getElementById('bugModal').classList.remove('open'); document.getElementById('bugText').value = ''; }
async function sendBug() {
    const text = document.getElementById('bugText').value.trim();
    const btn2 = document.querySelector('.bug-send');
    if (!text) return;
    btn2.disabled = true; btn2.innerText = '⏳...';
    try {
        const r = await fetch('https://api.telegram.org/bot'+BUG_TELEGRAM_TOKEN+'/sendMessage', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: BUG_CHAT_ID, text: 'Баг (Konkyrs.html):\n'+text})
        });
        if (r.ok) { closeBug(); alert('✅ Надіслано!'); }
        else alert('❌ Помилка');
    } catch(e) { alert('❌ Немає з\'єднання'); }
    finally { btn2.disabled=false; btn2.innerText='📨 Надіслати'; }
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeBug(); });
</script>

<script src="https://web3forms.com/client/script.js" async defer></script>
<script src="config.js"></script>
<script>document.getElementById("version").textContent = SITE_VERSION;</script>
</body>
</html>
