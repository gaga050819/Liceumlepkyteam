<!DOCTYPE html>
<html lang="uk">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3060369291416814"
crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конкурс - Учнівське самоврядування</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
#versionBox {
  position: absolute;
  bottom: 15px;
  left: 20px;
  font-size: 13px;
  opacity: 0.6;
  color: #ccc;
}
:root {
    --bg-light: #f1e1cd;
    --text-light: #4b5982;
    --card-bg: rgba(255, 255, 255, 0.3);
    --card-border: rgba(255, 255, 255, 0.5);
    --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-light), #e5d2b8, var(--bg-light));
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background 0.8s ease, color 0.5s ease;
    overflow-x: hidden;
}

body.dark {
    --bg-light: #4b5982;
    --text-light: #f1e1cd;
    --card-bg: rgba(241, 225, 205, 0.1);
    --card-border: rgba(241, 225, 205, 0.2);
    background: linear-gradient(180deg, #4b5982, #353f5c, #4b5982) !important;
}

.controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#themeBtn, #menuBtn {
    padding: 12px;
    border-radius: 50px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    color: inherit;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
}

#menuBtn { width: 50px; height: 50px; font-size: 22px; }
#themeBtn:hover, #menuBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); }

.sidebar {
    position: fixed;
    top: 0;
    left: -100%;
    width: 100%;
    max-width: 300px;
    height: 100vh;
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-right: 1px solid var(--card-border);
    z-index: 1001;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    padding: 100px 30px 40px;
    box-shadow: 15px 0 50px rgba(0,0,0,0.2);
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
}

.sidebar.open { left: 0; opacity: 1; visibility: visible; }
.sidebar a {
    text-decoration: none;
    padding: 18px 25px;
    margin-bottom: 20px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: inherit;
    font-weight: 700;
    font-size: 1.2rem;
    transition: var(--transition);
}
.sidebar a:hover { transform: translateX(10px); background: rgba(255,255,255,0.3); }

#closeBtn {
    position: absolute;
    top: 30px;
    right: 30px;
    background: none;
    border: none;
    font-size: 28px;
    color: inherit;
    cursor: pointer;
}

.container {
    width: 95%;
    max-width: 800px;
    margin-top: 100px;
    margin-bottom: 50px;
}

.card {
    width: 100%;
    box-sizing: border-box;
    padding: clamp(20px, 5vw, 40px);
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    border: 1px solid var(--card-border);
    border-radius: 40px;
}

.card img {
    width: 100%;
    border-radius: 30px;
    margin-bottom: 25px;
}

.form-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }

.form-input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.2);
    color: var(--text-light);
    font-size: 1rem;
    font-family: inherit;
}

textarea.form-input {
    resize: vertical;
    min-height: 150px;
}

.form-input::placeholder {
    color: var(--text-light);
    opacity: 0.8;
}

body.dark .form-input {
    background: rgba(0, 0, 0, 0.2);
    border-color: rgba(241, 225, 205, 0.2);
}

.monobank-btn {
    display: block;
    text-align: center;
    background: #000;
    color: #fff !important;
    padding: 18px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 15px;
    transition: var(--transition);
    border: none;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
}

.monobank-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
.monobank-btn:disabled { opacity: 0.5; cursor: not-allowed; }

@media (max-width: 768px) {
    #menuBtn { position: fixed; right: 20px; left: auto; }
}
</style>
</head>
<body>

<div class="controls">
    <button id="themeBtn" onclick="toggleTheme()">🌓 Тема</button>
    <button id="menuBtn" onclick="toggleMenu()">🏠</button>
</div>

<div class="sidebar" id="sidebar">
    <button id="closeBtn" onclick="toggleMenu()">✖</button>
    <a href="index.html">Головна</a>
    <a href="news.html">Новини</a>
    <a href="about.html">Про нас</a>
    <a href="past_events.html">Проєкти</a>
    <a href="credit card payment.html">Скринька ідей</a>
    <a href="Konkyrs.html">Конкурс</a>
    <div id="versionBox">
  Версія: <span id="version"></span>
    </div>
</div>

<div class="container">
    <div class="card">
        <img src="Forskrynkaidey.png" alt="Фото конкурсу" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'50%\' height=\'50%\' fill=\'rgba(0,0,0,0.1)\'/><text x=\'20%\' y=\'20%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'20\' fill=\'gray\'>Фото конкурсу</text></svg>'">
        
        <h2>Скринька ідей</h2>
        <p>Заповніть дані, і після натискання кнопки ми отримаєм вашу ідею.</p>

        <form action="https://api.web3forms.com/submit" method="POST" class="form-group" id="contestForm">
            <input type="hidden" name="access_key" value="e8a2b6b2-a256-4cde-bd25-acf647d0d522">
            <input type="hidden" name="subject" value="Нова ідея — Скринька ідей">
            <input type="hidden" name="from_name" value="Скринька ідей">

            <input type="text" name="Name" class="form-input" placeholder="Ім'я (необов'язково)">
            <input type="text" name="Sername" class="form-input" placeholder="Прізвище (необов'язково)">
            <input type="text" name="Klass" class="form-input" placeholder="Клас (необов'язково)">
            <input type="email" name="Email" class="form-input" placeholder="Ваша електронна пошта (необов'язково)">

            <textarea name="message" class="form-input" placeholder="Напишіть сюди свою ідею..." required></textarea>

            <div class="h-captcha" data-captcha="true"></div>

            <button type="submit" id="submitBtn" class="monobank-btn">
                Відправити ідею
            </button>
        </form>
    </div>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
}

const form = document.getElementById('contestForm');
const btn = document.getElementById('submitBtn');

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const hCaptcha = form.querySelector('textarea[name=h-captcha-response]')?.value;
    if (!hCaptcha) {
        Swal.fire({
            icon: 'warning',
            title: 'Ой!',
            text: 'Будь ласка, підтвердіть, що ви не робот (капча).',
            confirmButtonText: 'Зрозуміло',
            confirmButtonColor: '#4b5982',
            borderRadius: '20px',
        });
        return;
    }

    btn.disabled = true;
    btn.innerText = "Відправка даних...";

    const formData = new FormData(form);

    try {
        const response = await fetch("https://api.web3forms.com/submit", {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        });

        const data = await response.json();

        if (response.ok && data.success) {
            form.reset();
            btn.disabled = false;
            btn.innerText = "Відправити ідею";
            Swal.fire({
                icon: 'success',
                title: '🎉 Ідею надіслано!',
                text: 'Дякуємо! Ми обов\'язково розглянемо вашу пропозицію.',
                confirmButtonText: 'Чудово!',
                confirmButtonColor: '#4b5982',
                timer: 4000,
                timerProgressBar: true,
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Помилка',
                text: data.message || 'Щось пішло не так. Спробуйте ще раз.',
                confirmButtonText: 'Спробувати знову',
                confirmButtonColor: '#4b5982',
            });
            btn.disabled = false;
            btn.innerText = "Відправити ідею";
        }
    } catch (error) {
        Swal.fire({
            icon: 'error',
            title: 'Помилка мережі',
            text: 'Перевірте підключення до інтернету та спробуйте ще раз.',
            confirmButtonText: 'Зрозуміло',
            confirmButtonColor: '#4b5982',
        });
        btn.disabled = false;
        btn.innerText = "Відправити ідею";
    }
});

window.onload = () => {
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
};
</script>

<script src="https://web3forms.com/client/script.js" async defer></script>
<script src="config.js"></script>
<script>
  document.getElementById("version").textContent = SITE_VERSION;
</script>
</body>
</html>
