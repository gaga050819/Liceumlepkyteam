<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учнівське самоврядування</title>

<style>
:root {
    --bg-light: #f1e1cd;
    --text-light: #4b5982;
    --card-bg: rgba(255, 255, 255, 0.3);
    --card-border: rgba(255, 255, 255, 0.5);
    --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-light), #e5d2b8, var(--bg-light));
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background 0.8s ease, color 0.5s ease;
    overflow-x: hidden;
}

body.dark {
    --bg-light: #4b5982;
    --text-light: #f1e1cd;
    --card-bg: rgba(241, 225, 205, 0.1);
    --card-border: rgba(241, 225, 205, 0.2);
    background: linear-gradient(180deg, #4b5982, #353f5c, #4b5982) !important;
}

/* --- Controls --- */
.controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#themeBtn, #menuBtn {
    padding: 12px;
    border-radius: 50px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    color: inherit;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
}

#menuBtn { width: 50px; height: 50px; font-size: 22px; }
#themeBtn:hover, #menuBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); }

/* --- Sidebar --- */
.sidebar {
    position: fixed;
    top: 0;
    left: -100%;
    width: 100%;
    max-width: 300px;
    height: 100vh;
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-right: 1px solid var(--card-border);
    z-index: 1001;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    padding: 100px 30px 40px;
    box-shadow: 15px 0 50px rgba(0,0,0,0.2);
    box-sizing: border-box; 
    opacity: 0; 
    visibility: hidden;
}

.sidebar.open { 
    left: 0; 
    opacity: 1;
    visibility: visible;
}

.sidebar a {
    text-decoration: none;
    padding: 18px 25px;
    margin-bottom: 20px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: inherit;
    font-weight: 700;
    font-size: 1.2rem;
    transition: var(--transition);
}

.sidebar a:hover { transform: translateX(10px); background: rgba(255,255,255,0.3); }

#closeBtn {
    position: absolute;
    top: 30px;
    right: 30px;
    background: none;
    border: none;
    font-size: 28px;
    color: inherit;
    cursor: pointer;
}

/* --- Header --- */
header {
    width: 90%;
    max-width: 1200px;
    margin: 40px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
}

.main-title {
    grid-column: 2;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 900;
    text-align: center;
    margin: 0;
}

.logo {
    justify-self: end;
    width: clamp(50px, 10vw, 80px);
    height: clamp(50px, 10vw, 80px);
    border-radius: 50%;
    border: 3px solid currentColor;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

/* --- Cards --- */
.container {
    width: 95%;
    max-width: 1100px;
}

.card {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    gap: 40px;
    border-radius: 40px;
    padding: clamp(20px, 5vw, 40px);
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--card-border);
    margin-bottom: 50px;
    transition: var(--transition);
}

.hero-card { align-items: center; justify-content: center; }
.hero-box-label { font-size: 1.6rem; font-weight: 800; border-right: 3px solid currentColor; padding-right: 25px; }
.hero-text { font-size: 1.5rem; padding-left: 25px; font-style: italic; }

.section-label {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 25px;
}

.card img {
    width: 40%;
    max-width: 400px;
    height: auto;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 30px;
    border: 1px dashed currentColor;
}

.card-content {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.expand-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid currentColor;
    background: none;
    color: inherit;
    font-size: 28px;
    cursor: pointer;
    transition: var(--transition);
}

.card.expanded .expand-btn { transform: rotate(45deg); }
.more-text { display: none; margin-top: 20px; font-size: 1.1rem; line-height: 1.6; animation: fadeIn 0.6s ease; }
.card.expanded .more-text { display: block; }

/* --- Footer --- */
footer {
    width: 100%;
    padding: 60px 20px;
    background: rgba(0,0,0,0.03);
    text-align: center;
    margin-top: auto;
    box-sizing: border-box;
}

.social-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 30px;
}

.social-links a {
    text-decoration: none;
    color: inherit;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 1px;
    padding: 10px 20px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transition: var(--transition);
}

.social-links a:hover { 
    transform: translateY(-5px);
    background: var(--text-light); 
    color: var(--bg-light); 
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* --- Responsive --- */
@media (max-width: 768px) {
    .controls { flex-direction: row; width: calc(100% - 40px); justify-content: space-between; top: 15px; }
    #themeBtn, #menuBtn { padding: 10px 15px; height: 45px; font-size: 14px; }
    #menuBtn { width: 45px; padding: 0; }
    header { display: flex; flex-direction: column-reverse; gap: 15px; margin-top: 70px; }
    .main-title { font-size: 2.2rem; }
    .logo { align-self: center; }
    .card { flex-direction: column; text-align: center; }
    .card img { width: 100%; }
    .hero-box-label { border-right: none; border-bottom: 3px solid currentColor; padding-bottom: 10px; margin-bottom: 10px; }
    .hero-text { padding-left: 0; }
    .card-content { position: relative; }
    .expand-btn { position: absolute; top: -15px; right: 0; margin: 0; }
}
</style>
</head>
<body>

<div class="controls">
    <button id="themeBtn" onclick="toggleTheme()">🌓 Тема</button>
    <button id="menuBtn" onclick="toggleMenu()">🏠</button>
</div>

<div class="sidebar" id="sidebar">
    <button id="closeBtn" onclick="toggleMenu()">✖</button>
    <a href="news.html">Новини</a>    
    <a href="about.html">Про нас</a>
</div>

<header>
    <h1 class="main-title">Головна</h1>
    <div class="logo">ЛОГО</div>
</header>

<div class="container">
    <div class="card hero-card">
        <div class="hero-box-label">Загальна довідка</div>
        <div class="hero-text">це наш сайт...</div>
    </div>

    <div class="section-label">найновіший захід:</div>

    <div class="card" id="eventCard">
        <img id="placeholderImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='rgba(0,0,0,0.1)'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%234b5982'>Місце під фото</text></svg>" alt="Захід">
        <div class="card-content">
            <button class="expand-btn" onclick="toggleExpand()">+</button>
            <h2>Заголовок заходу</h2>
            <p>Короткий опис</p>
            <div class="more-text">
                <p>повний опис</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="social-links">
        <a href="https://www.instagram.com/uchnivskesamovriaduvannia?igsh=MXJtNmliZXJoYmZwdA==" target="_blank">INSTAGRAM</a>
        <a href="https://www.facebook.com/share/1DtXY2x5Us/?mibextid=wwXIfr" target="_blank">FACEBOOK</a>
        <a href="https://t.me/DNLLepkyi" target="_blank">TELEGRAM</a>
        <a href="https://www.tiktok.com/@lyceumlepkogo?_r=1&_t=ZS-94d1kkArRpN" target="_blank">TIKTOK</a>
    </div>
    <p style="opacity: 0.6; font-size: 0.85rem; font-weight: 600;">&copy; 2026 учнівське самоврядування</p>
</footer>

<script>
function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updatePlaceholder(isDark);
}

function updatePlaceholder(isDark) {
    const img = document.getElementById('placeholderImg');
    const color = isDark ? '%23f1e1cd' : '%234b5982';
    img.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='rgba(0,0,0,0.1)'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='${color}'>Місце під фото</text></svg>`;
}

function toggleExpand() {
    document.getElementById('eventCard').classList.toggle('expanded');
}

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
}

window.onload = () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        updatePlaceholder(true);
    }
};
</script>

</body>
</html>
