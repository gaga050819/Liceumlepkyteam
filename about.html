<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f1e1cd" id="theme-color-meta">
    <title>Про нас - Учнівське самоврядування</title>

    <style>
        :root {
            --bg-light: #f1e1cd;
            --text-light: #4b5982;
            --card-bg: rgba(255, 255, 255, 0.3);
            --card-border: rgba(255, 255, 255, 0.5);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg-light), #e5d2b8, var(--bg-light));
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.8s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        body.dark {
            --bg-light: #4b5982;
            --text-light: #f1e1cd;
            --card-bg: rgba(241, 225, 205, 0.1);
            --card-border: rgba(241, 225, 205, 0.2);
            background: linear-gradient(180deg, #4b5982, #353f5c, #4b5982) !important;
        }

        /* --- Controls --- */
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column; 
            gap: 15px;
        }

        #themeBtn, #menuBtn {
            padding: 12px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: inherit;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menuBtn { width: 50px; height: 50px; font-size: 22px; }
        
        @media (hover: hover) {
            #themeBtn:hover, #menuBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); }
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            max-width: 300px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--card-border);
            z-index: 1001;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            padding: 100px 30px 40px;
            box-sizing: border-box; 
            opacity: 0; 
            visibility: hidden;
        }

        .sidebar.open { left: 0; opacity: 1; visibility: visible; }
        .sidebar a {
            text-decoration: none;
            padding: 18px 25px;
            margin-bottom: 20px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: inherit;
            font-weight: 700;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        @media (hover: hover) {
            .sidebar a:hover { transform: translateX(10px); background: rgba(255,255,255,0.3); }
        }

        #closeBtn {
            position: absolute; top: 30px; right: 30px; background: none; border: none; font-size: 28px; color: inherit; cursor: pointer;
        }

        /* --- Header --- */
        header {
            width: 90%;
            max-width: 1200px;
            margin: 60px 0 40px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .main-title {
            grid-column: 2;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            text-align: center;
            margin: 0;
        }

        .logo {
            grid-column: 3;
            justify-self: end;
            width: clamp(60px, 10vw, 80px);
            height: clamp(60px, 10vw, 80px);
            border-radius: 50%;
            border: 3px solid currentColor;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            overflow: hidden; /* Додано, щоб картинка не виходила за межі */
        }

        /* --- Content Cards --- */
        .container {
            width: 90%;
            max-width: 1100px;
        }

        .card {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            gap: 40px;
            border-radius: 40px;
            padding: clamp(20px, 5vw, 40px);
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            margin-bottom: 50px;
            position: relative;
            transition: var(--transition);
        }

        .photo-placeholder {
            width: 35%;
            max-width: 250px;
            aspect-ratio: 3/4;
            border: 1px dashed currentColor;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            object-fit: cover;
        }

        .card-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-content h2 { font-size: 2.2rem; margin: 0 0 10px; }

        .expand-btn {
            position: absolute; 
            top: 25px; 
            right: 25px; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border: 2px solid currentColor; 
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            color: inherit; 
            font-size: 26px; 
            cursor: pointer; 
            transition: var(--transition); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            z-index: 10;
        }

        .card.expanded .expand-btn { transform: rotate(45deg); }
        .more-text { display: none; margin-top: 20px; animation: fadeIn 0.5s ease; font-size: 1.1rem; line-height: 1.6; }
        .card.expanded .more-text { display: block; }

        /* --- Footer --- */
        footer { width: 100%; padding: 40px 20px 30px; text-align: center; margin-top: auto; box-sizing: border-box; }
        .social-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .social-links a { text-decoration: none; color: inherit; font-weight: 700; transition: 0.3s; font-size: 0.9rem; letter-spacing: 1px; }
        .social-links a:hover { opacity: 0.7; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            .controls { 
                flex-direction: row; 
                width: calc(100% - 40px); 
                justify-content: space-between; 
                top: 15px; 
            }
            #themeBtn, #menuBtn { padding: 10px 15px; height: 45px; font-size: 14px; }
            #menuBtn { 
                width: 45px; 
                padding: 0; 
                position: fixed; 
                right: 20px; 
                left: auto; 
            }

            header { 
                display: flex; 
                flex-direction: column; 
                gap: 15px; 
                margin-top: 70px; 
                margin-bottom: 30px;
            }
            .logo { align-self: center; justify-self: center; order: -1; }
            
            .card { 
                flex-direction: column; 
                align-items: center;
                text-align: center; 
                padding: 60px 20px 25px; 
                gap: 20px;
                border-radius: 30px;
            }
            
            .photo-placeholder { 
                width: 70%; 
                max-width: 250px; 
            }
            
            .card-content h2 { font-size: 1.8rem; }
            
            .expand-btn { 
                top: 20px; 
                right: 20px; 
                width: 40px; 
                height: 40px; 
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="controls">
    <button id="themeBtn" onclick="toggleTheme()">🌓 Тема</button>
    <button id="menuBtn" onclick="toggleMenu()" aria-label="Меню">🏠</button>
</div>

<div class="sidebar" id="sidebar">
    <button id="closeBtn" onclick="toggleMenu()" aria-label="Закрити меню">✖</button>
    <a href="index.html">Головна</a>
    <a href="news.html">Новини</a>
    <a href="about.html">Про нас</a>
    <a href="past_events.html">Минулі заходи</a>
</div>

<header>
    <h1 class="main-title">Про нас</h1>
    <div class="logo">
        <img src="Logo1variant.png" alt="Логотип" style="width: 120%; height: 120%; object-fit: cover;">
    </div>
</header>

<div class="container">
    <div class="card" id="cardYana">
        <button class="expand-btn" onclick="toggleExpand('cardYana')" aria-label="Розгорнути інформацію">+</button>
        <div class="photo-placeholder">ФОТО</div>
        <div class="card-content">
            <h2>Яна:</h2>
            <p>Текст 1 (Посада або опис)</p>
            <div class="more-text">
                <p>Текст 2: Більше деталей тут</p>
                <p>Текст 3: Контакти</p>
            </div>
        </div>
    </div>

    <div class="card" id="cardYaryna">
        <button class="expand-btn" onclick="toggleExpand('cardYaryna')" aria-label="Розгорнути інформацію">+</button>
        <div class="photo-placeholder">ФОТО</div>
        <div class="card-content">
            <h2>Ярина:</h2>
            <p>Текст 1 (Посада або опис)</p>
            <div class="more-text">
                <p>Текст 2 і 3: Опис проектів та діяльності</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="social-links">
        <a href="https://www.instagram.com/uchnivskesamovriaduvannia?igsh=MXJtNmliZXJoYmZwdA==" target="_blank">INSTAGRAM</a>
        <a href="https://www.facebook.com/share/1DtXY2x5Us/?mibextid=wwXIfr" target="_blank">FACEBOOK</a>
        <a href="https://t.me/DNLLepkyi" target="_blank">TELEGRAM</a>
        <a href="https://www.tiktok.com/@lyceumlepkogo?_r=1&_t=ZS-94d1kkArRpN" target="_blank">TIKTOK</a>
    </div>
    <p style="opacity: 0.6; font-size: 0.85rem; font-weight: 600;">&copy; 2026 учнівське самоврядування</p>
</footer>

<script>
function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
    document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#4b5982' : '#f1e1cd');
}

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleExpand(id) {
    document.getElementById(id).classList.toggle('expanded');
}

window.onload = () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('theme-color-meta').setAttribute('content', '#4b5982');
    }
};
</script>

</body>
</html>
