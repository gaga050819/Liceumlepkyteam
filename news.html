<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новини - Учнівське самоврядування</title>

<style>
:root {
    --bg-light: #f1e1cd;
    --text-light: #4b5982;
    --card-bg: rgba(255, 255, 255, 0.3);
    --card-border: rgba(255, 255, 255, 0.5);
    --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-light), #e5d2b8, var(--bg-light));
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background 0.8s ease, color 0.5s ease;
    overflow-x: hidden;
}

body.dark {
    --bg-light: #4b5982;
    --text-light: #f1e1cd;
    --card-bg: rgba(241, 225, 205, 0.1);
    --card-border: rgba(241, 225, 205, 0.2);
    background: linear-gradient(180deg, #4b5982, #353f5c, #4b5982) !important;
}

/* --- Controls --- */
.controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#themeBtn, #menuBtn {
    padding: 12px;
    border-radius: 50px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    color: inherit;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
}

#menuBtn { width: 50px; height: 50px; font-size: 22px; }
#themeBtn:hover, #menuBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); }

/* --- Sidebar --- */
.sidebar {
    position: fixed;
    top: 0;
    left: -100%;
    width: 100%;
    max-width: 300px;
    height: 100vh;
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-right: 1px solid var(--card-border);
    z-index: 1001;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    padding: 100px 30px 40px;
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
}

.sidebar.open { left: 0; opacity: 1; visibility: visible; }
.sidebar a {
    text-decoration: none;
    padding: 18px 25px;
    margin-bottom: 20px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    color: inherit;
    font-weight: 700;
    font-size: 1.2rem;
    transition: var(--transition);
}

.sidebar a:hover { transform: translateX(10px); background: rgba(255,255,255,0.3); }

#closeBtn {
    position: absolute;
    top: 30px;
    right: 30px;
    background: none;
    border: none;
    font-size: 28px;
    color: inherit;
    cursor: pointer;
}

/* --- Header --- */
header {
    width: 90%;
    max-width: 1200px;
    margin: 40px 0 40px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
}

.main-title {
    grid-column: 2;
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 900;
    text-align: center;
    margin: 0;
}

.logo {
    justify-self: end;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid currentColor;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

/* --- News Cards --- */
.container {
    width: 95%;
    max-width: 1000px;
}

.card {
    display: flex;
    gap: 30px;
    border-radius: 40px;
    padding: 30px;
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--card-border);
    margin-bottom: 30px;
    transition: var(--transition);
    position: relative;
}

.card-img-wrapper {
    width: 40%;
    min-width: 250px;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 25px;
    border: 1px dashed currentColor;
    aspect-ratio: 16/10;
}

.card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-top: 10px;
}

.card-content h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
.info-1 { font-size: 1.1rem; opacity: 0.9; }

.expand-btn {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid currentColor;
    background: none;
    color: inherit;
    font-size: 26px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card.expanded .expand-btn { transform: rotate(45deg); }

.more-info {
    max-height: 0;
    overflow: hidden;
    transition: all 0.5s ease;
    opacity: 0;
}

.card.expanded .more-info {
    max-height: 800px;
    opacity: 1;
    margin-top: 15px;
}

/* --- Footer --- */
footer {
    width: 100%;
    padding: 40px;
    text-align: center;
    margin-top: auto;
}

@media (max-width: 768px) {
    header { display: flex; flex-direction: column; gap: 20px; margin-top: 80px; }
    .logo { order: -1; }
    .card { flex-direction: column; padding: 20px; }
    .card-img-wrapper { width: 100%; min-width: unset; }
    .expand-btn { top: 20px; right: 20px; }

    /* Розділення кнопок на телефонах */
    .controls {
        left: 20px;
        right: 20px;
        flex-direction: row;
        justify-content: space-between;
        pointer-events: none; /* Пропускає кліки крізь контейнер */
    }
    #themeBtn, #menuBtn {
        pointer-events: auto; /* Повертає кліки самим кнопкам */
    }
}
</style>
</head>
<body>

<div class="controls">
    <button id="themeBtn" onclick="toggleTheme()">🌓 Тема</button>
    <button id="menuBtn" onclick="toggleMenu()">🏠</button>
</div>

<div class="sidebar" id="sidebar">
    <button id="closeBtn" onclick="toggleMenu()">✖</button>
    <a href="index.html">Головна</a>
    <a href="news.html">Новини</a>
    <a href="about.html">Про нас</a>
    <a href="past_events.html">Минулі заходи</a>
</div>

<header>
    <h1 class="main-title">Новини</h1>
    <div class="logo">ЛОГО</div>
</header>

<div class="container">
    <div class="card">
        <div class="card-img-wrapper">
            <img class="news-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><rect width='100%' height='100%' fill='rgba(0,0,0,0.05)'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='20' fill='%234b5982'>Фото новини 1</text></svg>" alt="Новина 1">
        </div>
        <div class="card-content">
            <button class="expand-btn" onclick="toggleExpand(this)">+</button>
            <h2>Новина 1</h2>
            <div class="info-1">Основна інфа 1</div>
            <div class="more-info">
                <p>Детальний опис</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-img-wrapper">
            <img class="news-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><rect width='100%' height='100%' fill='rgba(0,0,0,0.05)'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='20' fill='%234b5982'>Фото новини 2</text></svg>" alt="Новина 2">
        </div>
        <div class="card-content">
            <button class="expand-btn" onclick="toggleExpand(this)">+</button>
            <h2>Новина 2</h2>
            <div class="info-1">Основна інфа 1</div>
            <div class="more-info">
                <p>Детальний опис</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p style="opacity: 0.6; font-size: 0.85rem; font-weight: 600;">&copy; 2026 учнівське самоврядування</p>
</footer>

<script>
function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updatePlaceholders(isDark);
}

function updatePlaceholders(isDark) {
    const images = document.querySelectorAll('.news-img');
    const color = isDark ? '%23f1e1cd' : '%234b5982';
    images.forEach((img, index) => {
        img.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><rect width='100%' height='100%' fill='rgba(0,0,0,0.05)'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='20' fill='${color}'>Фото новини ${index + 1}</text></svg>`;
    });
}

function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleExpand(btn) {
    const card = btn.closest('.card');
    card.classList.toggle('expanded');
}

window.onload = () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        updatePlaceholders(true);
    }
};
</script>

</body>
</html>
